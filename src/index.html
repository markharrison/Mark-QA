<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Alarms Map - MarkMap</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>UK Alarms Map</h1>
            <div class="header-info">
                <span id="alarm-count">Loading alarms...</span>
                <span id="last-update">Last updated: Never</span>
            </div>
        </header>

        <div class="content">
            <div id="map"></div>
            
            <div class="controls">
                <button id="add-alarm-btn" class="btn btn-primary">Add New Alarm</button>
                <button id="refresh-btn" class="btn btn-secondary">Refresh Now</button>
            </div>
        </div>
    </div>

    <!-- Add Alarm Modal -->
    <div id="add-alarm-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Alarm</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="add-alarm-form">
                    <div class="form-group">
                        <label for="alarm-name">Name:</label>
                        <input type="text" id="alarm-name" name="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="alarm-latitude">Latitude:</label>
                        <input type="number" id="alarm-latitude" name="latitude" 
                               step="0.000001" min="49" max="61" required>
                        <small>UK range: 49 to 61</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="alarm-longitude">Longitude:</label>
                        <input type="number" id="alarm-longitude" name="longitude" 
                               step="0.000001" min="-8" max="2" required>
                        <small>UK range: -8 to 2</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="alarm-text">Description:</label>
                        <textarea id="alarm-text" name="text" rows="3"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="alarm-status">Status:</label>
                        <select id="alarm-status" name="status">
                            <option value="green">Green (Normal)</option>
                            <option value="amber">Amber (Warning)</option>
                            <option value="red">Red (Critical)</option>
                        </select>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Add Alarm</button>
                        <button type="button" class="btn btn-secondary cancel-btn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Confirm Delete</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this alarm?</p>
                <p><strong id="delete-alarm-name"></strong></p>
                <div class="form-actions">
                    <button id="confirm-delete-btn" class="btn btn-danger">Delete</button>
                    <button class="btn btn-secondary cancel-btn">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    
    <!-- Custom JavaScript -->
    <script src="app.js"></script>
</body>
</html>
